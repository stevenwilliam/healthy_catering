# Evermore — nginx reverse proxy.
#
# Install to /etc/nginx/sites-available/evermore and symlink into
# sites-enabled. Only 80/443 are open on the host; the Go service listens on
# 127.0.0.1:8081 and is never exposed directly (99 §9).

upstream evermore_api {
    server 127.0.0.1:8081;
    keepalive 32;
}

# Until evermore.co.id resolves, the site is reachable by IP on its own port.
# ruuma already owns `listen 80 default_server`, so taking port 80 here would
# hijack every request to the bare IP (Steven: "use different port if
# conflicting with ruuma").
server {
    listen 8090;
    listen [::]:8090;
    server_name www.evermore.co.id evermore.co.id _;

    # certbot writes its challenge here before the redirect applies.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Everything else goes to TLS. Enable this ONLY after certbot has issued
    # the certificate, or the challenge above cannot complete.
    # return 301 https://www.evermore.co.id$request_uri;

    location / {
        proxy_pass http://evermore_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # The service sets its own security headers; nginx adds only what it owns.
    server_tokens off;
    client_max_body_size 6m;   # payment proofs are capped at 5 MB

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Fonts and CSS are immutable per deploy; the woff2 files never change
    # within a release.
    location ~* \.(woff2|woff|css|js|png|jpg|svg)$ {
        proxy_pass http://evermore_api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

