# Evermore — nginx reverse proxy.
#
# Install to /etc/nginx/sites-available/evermore and symlink into
# sites-enabled. Only 80/443 are open on the host; the Go service listens on
# 127.0.0.1:8081 and is never exposed directly (99 §9).

upstream evermore_api {
    server 127.0.0.1:8081;
    keepalive 32;
}

# Until evermore.co.id resolves, the site is reachable by IP on its own port.
# ruuma already owns `listen 80 default_server`, so taking port 80 here would
# hijack every request to the bare IP (Steven: "use different port if
# conflicting with ruuma").
server {
    listen 8090;
    listen [::]:8090;
    # dev.evermore.co.id is the hostname for this stage (Steven, 2026-08-13);
    # www/apex stay listed so production is a TLS change, not a rename.
    # `_` keeps the bare IP working while DNS is still unset.
    server_name dev.evermore.co.id www.evermore.co.id evermore.co.id _;

    # certbot writes its challenge here before the redirect applies.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Everything else goes to TLS. Enable this ONLY after certbot has issued
    # the certificate, or the challenge above cannot complete.
    # return 301 https://www.evermore.co.id$request_uri;

    location / {
        proxy_pass http://evermore_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # The service sets its own security headers; nginx adds only what it owns.
    server_tokens off;
    client_max_body_size 6m;   # payment proofs are capped at 5 MB

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Caching, split by whether the FILENAME changes when the content does.
    #
    # This block used to include css/js/png/jpg/svg and marked them all
    # `immutable` for 30 days. That was wrong and it cost a real debugging
    # session: `immutable` tells a browser never to revalidate, not even with a
    # conditional request, so every stylesheet change after a visitor's first
    # load was invisible to them until they cleared their cache. The burger
    # menu "not showing any button" was this, not the CSS.
    #
    # Fonts genuinely are immutable: the woff2 files are versioned by name and
    # their bytes never change within a release.
    location ~* \.(woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://evermore_api;
    }

    # Everything else keeps a stable filename, so it must REVALIDATE. The
    # templates append ?v=<build> to the stylesheets, which makes a changed
    # release a new URL and gives a fresh file immediately; this header is the
    # safety net for anything not versioned that way.
    location ~* \.(css|js|png|jpg|jpeg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        proxy_pass http://evermore_api;
    }
}

