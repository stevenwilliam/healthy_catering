<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app surface is transactional and must never be indexed
         (99 §13, robots.txt disallows it too). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Evermore</title>
    <meta name="theme-color" content="#1C3D34" />
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- One palette for both surfaces. The app reads the same tokens the
         server-rendered pages do, so --footer-h and the measured colours
         cannot drift between the two. -->
    <link rel="stylesheet" href="/css/tokens.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
