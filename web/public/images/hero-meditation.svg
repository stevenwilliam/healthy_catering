<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img"
     aria-labelledby="hero-title" width="800" height="800">
  <title id="hero-title">Tiga orang bermeditasi dengan tenang di taman</title>

  <!-- Interim hero art: a flat illustration in the brand palette, standing in
       until a photograph is supplied. Every colour is a token from
       docs/10-design-system.md. It is decorative — the <img> carries the alt
       text and the h1 says what the page is — so the tertiary colours that
       fail AA as TEXT are legitimate as illustration fills.

       Each figure is drawn legs -> torso -> head -> arms, in local coordinates
       with its origin at the base of the crossed legs, then placed with a
       transform. The shoulders overlap the jaw deliberately: with a gap there
       the head reads as floating above a point rather than sitting on a body.

       The geometry is repeated per figure rather than shared through <use>.
       A <use> clone lives in a shadow tree, which outside selectors such as
       ".f1 .robe" cannot match — the first attempt did exactly that and every
       figure rendered as a black silhouette, because only the inherited
       default applied. Explicit fill attributes are immune to that. -->

  <defs>
    <clipPath id="frame">
      <rect width="800" height="800" rx="40"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Sky: Restore Beige -->
    <rect width="800" height="800" fill="#FFFAE0"/>

    <!-- Sun -->
    <circle cx="648" cy="152" r="86" fill="#FFBC8F"/>

    <!-- Distant foliage -->
    <circle cx="118" cy="298" r="132" fill="#468973" opacity="0.32"/>
    <circle cx="248" cy="256" r="94" fill="#468973" opacity="0.28"/>
    <circle cx="704" cy="330" r="118" fill="#468973" opacity="0.28"/>

    <!-- Garden ground -->
    <path d="M0,548 Q400,458 800,548 L800,800 L0,800 Z" fill="#468973"/>
    <path d="M0,646 Q400,576 800,646 L800,800 L0,800 Z" fill="#1C3D34" opacity="0.32"/>

    <!-- Left plant -->
    <g fill="#1C3D34" opacity="0.7">
      <path d="M64,610 C64,528 34,486 24,446 C64,476 94,528 94,610 Z"/>
      <path d="M94,610 C94,540 134,498 164,478 C149,540 129,578 119,610 Z"/>
    </g>
    <!-- Right plant -->
    <g fill="#1C3D34" opacity="0.7">
      <path d="M746,610 C746,528 776,486 786,446 C746,476 716,528 716,610 Z"/>
      <path d="M716,610 C716,548 681,512 651,494 C666,548 686,582 696,610 Z"/>
    </g>

    <!-- Ground shadows -->
    <ellipse cx="196" cy="642" rx="104" ry="22" fill="#1C3D34" opacity="0.22"/>
    <ellipse cx="600" cy="646" rx="102" ry="22" fill="#1C3D34" opacity="0.22"/>
    <ellipse cx="400" cy="694" rx="122" ry="26" fill="#1C3D34" opacity="0.24"/>

    <!-- Left figure -->
    <g transform="translate(196,640) scale(0.92)">
      <ellipse cx="0" cy="0" rx="96" ry="30" fill="#3C2A24"/>
      <path d="M-58,4 C-68,-64 -48,-120 0,-120 C48,-120 68,-64 58,4 Z" fill="#B6DAFA"/>
      <circle cx="0" cy="-158" r="43" fill="#A36E50"/>
      <path d="M0,-201 C34,-201 43,-176 43,-158 C30,-176 16,-180 0,-180
               C-16,-180 -30,-176 -43,-158 C-43,-176 -34,-201 0,-201 Z" fill="#1C3D34"/>
      <path d="M-52,-96 C-82,-70 -88,-34 -74,-10" fill="none" stroke="#A36E50"
            stroke-width="19" stroke-linecap="round"/>
      <path d="M52,-96 C82,-70 88,-34 74,-10" fill="none" stroke="#A36E50"
            stroke-width="19" stroke-linecap="round"/>
    </g>
    <!-- Right figure -->
    <g transform="translate(600,644) scale(0.9)">
      <ellipse cx="0" cy="0" rx="96" ry="30" fill="#3C2A24"/>
      <path d="M-58,4 C-68,-64 -48,-120 0,-120 C48,-120 68,-64 58,4 Z" fill="#CC6883"/>
      <circle cx="0" cy="-158" r="43" fill="#8B5A44"/>
      <path d="M0,-201 C34,-201 43,-176 43,-158 C30,-176 16,-180 0,-180
               C-16,-180 -30,-176 -43,-158 C-43,-176 -34,-201 0,-201 Z" fill="#1C3D34"/>
      <path d="M-52,-96 C-82,-70 -88,-34 -74,-10" fill="none" stroke="#8B5A44"
            stroke-width="19" stroke-linecap="round"/>
      <path d="M52,-96 C82,-70 88,-34 74,-10" fill="none" stroke="#8B5A44"
            stroke-width="19" stroke-linecap="round"/>
    </g>
    <!-- Centre figure last: nearest the viewer, so it overlaps the other two -->
    <g transform="translate(400,692) scale(1.06)">
      <ellipse cx="0" cy="0" rx="96" ry="30" fill="#3C2A24"/>
      <path d="M-58,4 C-68,-64 -48,-120 0,-120 C48,-120 68,-64 58,4 Z" fill="#FFBC8F"/>
      <circle cx="0" cy="-158" r="43" fill="#613F37"/>
      <path d="M0,-201 C34,-201 43,-176 43,-158 C30,-176 16,-180 0,-180
               C-16,-180 -30,-176 -43,-158 C-43,-176 -34,-201 0,-201 Z" fill="#1C3D34"/>
      <path d="M-52,-96 C-82,-70 -88,-34 -74,-10" fill="none" stroke="#613F37"
            stroke-width="19" stroke-linecap="round"/>
      <path d="M52,-96 C82,-70 88,-34 74,-10" fill="none" stroke="#613F37"
            stroke-width="19" stroke-linecap="round"/>
    </g>

    <!-- Foreground grass tufts -->
    <g stroke="#1C3D34" stroke-width="7" stroke-linecap="round" opacity="0.45" fill="none">
      <path d="M56,762 Q66,722 80,754"/>
      <path d="M292,784 Q304,746 318,778"/>
      <path d="M706,764 Q718,724 732,756"/>
    </g>
  </g>
</svg>
