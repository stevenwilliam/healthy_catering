<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Tiled background motif for the deep-green page ground.
       Steven, 2026-08-19: like WhatsApp's chat wallpaper, so the ground is not
       so plain.

       Rules it has to keep:
         - DECORATIVE ONLY. It carries no meaning, so it is a CSS background
           rather than an <img>, and nothing announces it.
         - It must not cost legibility. Beige at 5% over #1C3D34 lifts the
           background to about #27473D, where beige text still measures 9.88
           and white 10.38 — both still AAA. Raising the opacity is not a free
           knob: 10% already costs a full point of contrast.
         - It tiles seamlessly. Motifs near an edge are repeated on the
           opposite edge so the 300px seam does not show as a grid.

       Motifs are food and wellbeing shapes drawn in the same flat style as the
       diet-card marks: leaf, bowl, avocado, droplet, sprout, dumbbell, wheat,
       heart, cup, fish. -->
  <g fill="#FFFAE0" fill-opacity="0.05">

    <!-- leaf -->
    <g transform="translate(30,34) rotate(-18) scale(1.05)">
      <path d="M0,0 C16,-16 34,-14 40,-2 C28,10 10,12 0,0 Z"/>
      <path d="M0,0 C12,-4 26,-6 38,-3" stroke="#FFFAE0" stroke-opacity="0.05"
            stroke-width="1.6" fill="none"/>
    </g>

    <!-- bowl with steam -->
    <g transform="translate(140,26) rotate(6)">
      <path d="M-20,4 h40 a20,20 0 0 1 -40,0 Z"/>
      <path d="M-8,-6 C-8,-12 -2,-12 -2,-18" stroke="#FFFAE0" stroke-opacity="0.05"
            stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M4,-6 C4,-12 10,-12 10,-18" stroke="#FFFAE0" stroke-opacity="0.05"
            stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- avocado half -->
    <g transform="translate(246,44) rotate(14)">
      <path fill-rule="evenodd"
            d="M0,-22 C11,-22 18,-9 18,2 C18,14 10,22 0,22 C-10,22 -18,14 -18,2
               C-18,-9 -11,-22 0,-22 Z
               M0,-4 a8,8 0 1 0 0.1,0 Z"/>
    </g>

    <!-- droplet -->
    <g transform="translate(64,116) rotate(-8)">
      <path d="M0,-16 C8,-6 13,0 13,6 A13,13 0 0 1 -13,6 C-13,0 -8,-6 0,-16 Z"/>
    </g>

    <!-- sprout -->
    <g transform="translate(178,124) rotate(10)">
      <path d="M0,14 V-4" stroke="#FFFAE0" stroke-opacity="0.05" stroke-width="2"
            fill="none" stroke-linecap="round"/>
      <path d="M0,-2 C-12,-4 -16,-14 -6,-16 C0,-15 1,-8 0,-2 Z"/>
      <path d="M0,-2 C12,-6 15,-16 5,-17 C-1,-15 -1,-8 0,-2 Z"/>
    </g>

    <!-- dumbbell -->
    <g transform="translate(268,150) rotate(-24)">
      <rect x="-9" y="-3" width="18" height="6" rx="3"/>
      <rect x="-16" y="-8" width="6" height="16" rx="2.5"/>
      <rect x="10" y="-8" width="6" height="16" rx="2.5"/>
    </g>

    <!-- wheat -->
    <g transform="translate(36,206) rotate(16)">
      <path d="M0,20 V-6" stroke="#FFFAE0" stroke-opacity="0.05" stroke-width="2"
            fill="none" stroke-linecap="round"/>
      <path d="M0,-6 C-9,-8 -10,-16 -2,-16 C2,-14 2,-10 0,-6 Z"/>
      <path d="M0,0 C-9,-2 -10,-10 -2,-10 C2,-8 2,-4 0,0 Z"/>
      <path d="M0,0 C9,-2 10,-10 2,-10 C-2,-8 -2,-4 0,0 Z"/>
      <path d="M0,-6 C9,-8 10,-16 2,-16 C-2,-14 -2,-10 0,-6 Z"/>
    </g>

    <!-- heart -->
    <g transform="translate(150,196) rotate(-12) scale(0.9)">
      <path d="M0,18 C-16,6 -18,-4 -11,-9 C-6,-12 -1,-8 0,-5
               C1,-8 6,-12 11,-9 C18,-4 16,6 0,18 Z"/>
    </g>

    <!-- cup -->
    <g transform="translate(242,238) rotate(8)">
      <path d="M-13,-9 h22 v13 a11,11 0 0 1 -22,0 Z"/>
      <path d="M9,-5 h5 a5,5 0 0 1 0,10 h-5" stroke="#FFFAE0" stroke-opacity="0.05"
            stroke-width="2" fill="none"/>
    </g>

    <!-- fish -->
    <g transform="translate(104,266) rotate(-6)">
      <path d="M-18,0 C-10,-9 6,-9 14,0 C6,9 -10,9 -18,0 Z"/>
      <path d="M14,0 L22,-6 V6 Z"/>
    </g>

    <!-- Edge repeats, so the tile seam is invisible.
         Each of these is the same motif drawn 300px away on one axis. -->
    <g transform="translate(330,34) rotate(-18) scale(1.05)">
      <path d="M0,0 C16,-16 34,-14 40,-2 C28,10 10,12 0,0 Z"/>
    </g>
    <g transform="translate(-54,44) rotate(14)">
      <path fill-rule="evenodd"
            d="M0,-22 C11,-22 18,-9 18,2 C18,14 10,22 0,22 C-10,22 -18,14 -18,2
               C-18,-9 -11,-22 0,-22 Z
               M0,-4 a8,8 0 1 0 0.1,0 Z"/>
    </g>
    <g transform="translate(-32,150) rotate(-24)">
      <rect x="-9" y="-3" width="18" height="6" rx="3"/>
      <rect x="-16" y="-8" width="6" height="16" rx="2.5"/>
      <rect x="10" y="-8" width="6" height="16" rx="2.5"/>
    </g>
    <g transform="translate(30,334) rotate(-18) scale(1.05)">
      <path d="M0,0 C16,-16 34,-14 40,-2 C28,10 10,12 0,0 Z"/>
    </g>
    <g transform="translate(104,-34) rotate(-6)">
      <path d="M-18,0 C-10,-9 6,-9 14,0 C6,9 -10,9 -18,0 Z"/>
      <path d="M14,0 L22,-6 V6 Z"/>
    </g>
    <g transform="translate(242,-62) rotate(8)">
      <path d="M-13,-9 h22 v13 a11,11 0 0 1 -22,0 Z"/>
    </g>
  </g>
</svg>
